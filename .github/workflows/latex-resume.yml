name: Build and Release LaTeX Resume

on:
  push:
    branches: [ main, master ]
    paths:
      - 'resume.tex'
      - '.github/workflows/latex-resume.yml'
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build-latex:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Compile LaTeX to PDF
      uses: xu-cheng/latex-action@v3
      with:
        root_file: resume.tex
        latexmk_use_xelatex: true
        extra_packages: |
          scheme-full
          
    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      
    - name: Upload PDF as artifact
      uses: actions/upload-artifact@v4
      with:
        name: resume-pdf-${{ steps.date.outputs.date }}
        path: resume.pdf
        
    - name: Create Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: resume-${{ steps.date.outputs.date }}-${{ github.sha }}
        name: Resume PDF - ${{ steps.date.outputs.date }}
        body: |
          ## Resume PDF Release
          
          Automatically generated PDF from LaTeX source.
          
          **Build Date:** ${{ steps.date.outputs.date }}
          **Commit:** ${{ github.sha }}
          
          Download the PDF below to view the latest version of the resume.
        files: resume.pdf
        token: ${{ secrets.GITHUB_TOKEN }}
        draft: false
        prerelease: false